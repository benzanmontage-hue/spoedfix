<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klus — Spoedfix</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:image" content="https://benzanmontage-hue.github.io/spoedfix/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://benzanmontage-hue.github.io/spoedfix/assets/og-image.png">
  <link rel="canonical" href="https://benzanmontage-hue.github.io/spoedfix/klus.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Klus — Spoedfix">
  <meta property="og:description" content="">
  <meta property="og:url" content="https://benzanmontage-hue.github.io/spoedfix/klus.html">
  <meta property="og:site_name" content="Spoedfix">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="klussen">
  <header id="header"></header>

  <main class="container page">
    <div id="detail"></div>
  </main>

  <footer>
    <div class="container">
      <div><strong><img src="assets/logo-dark.png" alt="" class="logo-img logo-img-footer"> Spoedfix</strong></div>
      <div><a href="diensten.html">Diensten</a> · <a href="klussen.html">Klussen</a> · <a href="plaatsen.html">Plaatsen</a> · <a href="login.html">Inloggen</a> · <a href="privacy.html">Privacy</a> · <a href="voorwaarden.html">Voorwaarden</a></div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    let CURRENT_JOB = null;
    document.addEventListener("DOMContentLoaded", async () => {
      const id = qs("id");
      const el = document.getElementById("detail");
      if (!id) { el.innerHTML = '<div class="empty">Geen klus opgegeven.</div>'; return; }
      const job = await SF.getJob(id);
      if (!job) { el.innerHTML = '<div class="empty"><div class="big">📋</div>Klus niet gevonden.</div>'; return; }
      CURRENT_JOB = job;
      const cats = await SF.getCategories();
      const cat = cats.find(c => c.id === job.category_id);
      const poster = await SF.getProfile(job.poster_id);
      const bids = await SF.getBids(id);
      const budget = job.budget_min || job.budget_max ? `€${job.budget_min||0} – €${job.budget_max||"?"}` : "n.t.b.";

      const bidsHtml = bids.length
        ? bids.map(b => `<div class="list-row">
            <div><div class="t">${esc((b.voornaam)||"Aanbieder")}</div><div class="s">${esc(b.bericht || "")}</div></div>
            <span class="price price-sm">${euro(b.bedrag)}</span>
          </div>`).join("")
        : '<div class="text-muted empty-inline">Nog geen offertes.</div>';

      el.innerHTML = `
        <div class="detail-grid">
          <div class="detail-main">
            <div class="meta">
              <span class="badge badge-cat">${esc(cat?.naam || "Klus")}</span>
              <span class="badge badge-regio">📍 ${esc(job.regio)}</span>
              <span class="badge badge-open">Open</span>
            </div>
            <h1>${esc(job.titel)}</h1>
            <div class="desc">${esc(job.omschrijving || "Geen omschrijving.")}</div>
            ${job.deadline ? `<p class="mt-2 text-muted">🗓️ Deadline: ${esc(job.deadline)}</p>` : ""}
            <p class="mt-2 text-muted">Geplaatst ${tijdAgo(job.created_at)} door ${esc(poster?.voornaam || "een klant")}</p>
            <div class="panel mt-3" id="matching-panel" style="display:none">
              <h2>Matching <span class="badge badge-open badge-row-end">● Actief</span></h2>
              <div id="matching-inhoud"></div>
            </div>
            <div class="panel mt-3">
              <h2>Offertes (${bids.length})</h2>
              ${bidsHtml}
            </div>
          </div>
          <div class="detail-side">
            <div class="price-big">${budget}</div>
            <p class="text-muted side-note">Budget-indicatie van de klant.</p>
            <hr class="rule">
            <form onsubmit="bied(event, '${job.id}')">
              <label>Jouw offerte (€)</label>
              <input type="number" id="b-bedrag" min="1" step="0.01" required placeholder="bv. 120">
              <label>Bericht (optioneel)</label>
              <textarea id="b-bericht" placeholder="Waarom ben jij de juiste?"></textarea>
              <button class="btn btn-primary btn-block mt-2" type="submit">Offerte plaatsen</button>
              <p class="hint center">Gratis reageren. Pas bij een gewonnen klus betaal je 25% commissie.</p>
            </form>
          </div>
        </div>`;

      renderMatching();
      setInterval(renderMatching, 5000);
    });

    async function renderMatching() {
      if (!CURRENT_JOB) return;
      const panel = document.getElementById("matching-panel");
      const inhoud = document.getElementById("matching-inhoud");
      if (!panel || !inhoud) return;
      const status = await SF.matchingStatus(CURRENT_JOB);
      panel.style.display = "";
      const prov = status.providers;
      inhoud.innerHTML = `
        <div class="grid grid-tight mb-2 matching-stats">
          <div class="stat-mini">
            <div class="k">Zoekradius</div>
            <div class="v">${status.radius} km</div>
          </div>
          <div class="stat-mini">
            <div class="k">Budget-indicatie</div>
            <div class="v">€${status.vergoeding.bedrag || 0}</div>
          </div>
          <div class="stat-mini">
            <div class="k">Aanbieders in de buurt</div>
            <div class="v">${prov.length}</div>
          </div>
        </div>
        ${prov.length ? `
          <div class="text-muted list-label">Aanbieders die deze klus kunnen zien:</div>
          ${prov.map(p => `
            <div class="list-row">
              <div><div class="t">${esc((p.voornaam||"") + " " + (p.achternaam||""))} ${p.geverifieerd ? '<span class="badge badge-verified">✓</span>' : ""} ${p.categorie_match ? '<span class="badge badge-cat">passend</span>' : ""}</div>
              <div class="s">📍 ${esc(p.regio)} · ${p.afstand_km} km</div></div>
              <span class="pill pill-open">bereikbaar</span>
            </div>`).join("")}
        ` : `<div class="text-muted side-note">Nog geen aanbieders binnen ${status.radius} km. De zoekradius wordt automatisch vergroot zodat meer aanbieders je klus kunnen zien.</div>`}
        <p class="hint mt-2">${status.biedingen ? `${status.biedingen} offerte(s) ontvangen.` : "Nog geen offertes. Aanbieders bepalen zelf hun tarief en of ze reageren."}</p>`;
    }

    async function bied(e, jobId) {
      e.preventDefault();
      const user = await requireAuth();
      if (!user) return;
      const prof = await SF.getProfile(user.id);
      const rol = prof?.rol || user.rol || "klant";
      if (rol === "klant") { toast("Je moet aanbieder zijn om te reageren.", "error"); return; }
      const bedrag = document.getElementById("b-bedrag").value;
      const bericht = document.getElementById("b-bericht").value;
      const { error } = await SF.bidOnJob(jobId, user.id, Number(bedrag), bericht);
      if (error) { toast(error.message || "Fout bij plaatsen offerte", "error"); return; }
      toast("Offerte geplaatst!", "success");
      setTimeout(() => location.reload(), 700);
    }
  </script>
</body>
</html>
